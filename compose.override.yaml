# Docker Compose loads this file automatically for local development. Commands
# that pass only compose.yaml skip these mounts and use the production images.
services:
  web:
    build:
      target: development
    command: npm run dev -- --host 0.0.0.0
    ports: !override
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_DEV_PORT:-5173}:5173"
    # Keep Linux node_modules in Docker while source files update from the host.
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: "no"

  api:
    command:
      - flask
      - --app
      - app
      - run
      - --debug
      - --host=0.0.0.0
      - --port=8000
    environment:
      APP_ENV: development
    # Direct ports are useful for debugging, but remain bound to loopback.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    restart: "no"

  postgres:
    # The database is published only in development mode for local tools.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    restart: "no"

volumes:
  frontend_node_modules:
